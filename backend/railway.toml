[build]
builder = "railpack"

[deploy]
startCommand = "php -r \"if (!file_exists('database/database.sqlite')) { mkdir('database', 0755, true); touch('database/database.sqlite'); chmod('database/database.sqlite', 0666); }\" && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
preDeployCommand = "mkdir -p database && touch database/database.sqlite && chmod 666 database/database.sqlite && php artisan migrate --force && php artisan db:seed --force"