[build]
builder = "railpack"

[deploy]
startCommand = "mkdir -p database && [ ! -f database/database.sqlite ] && touch database/database.sqlite && chmod 666 database/database.sqlite || true && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
preDeployCommand = "mkdir -p database && touch database/database.sqlite && chmod 666 database/database.sqlite && php artisan migrate --force && php artisan db:seed --force"